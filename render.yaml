services:
  - type: web
    name: acemock-ai-powered-interviewer
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # ── Code runner proxy ──────────────────────────────────────────────────
      # The raw OneCompiler key (server-side only; NOT prefixed with VITE_).
      - key: ONECOMPILER_API_KEY
        sync: false          # fill in the Render dashboard

      # ── Frontend env vars bundled at build time ────────────────────────────
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

      # Tell the frontend to use the proxy path (same origin, no CORS)
      - key: VITE_CODE_RUNNER_URL
        value: /api/code-runner
