services:
  - type: web
    name: acemock-ai-powered-interviewer
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # ── Frontend env vars bundled at build time ────────────────────────────
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

      # Tell the frontend to use the server-side proxy (same origin, no CORS)
      # Piston API is free and requires no API key.
      - key: VITE_CODE_RUNNER_URL
        value: /api/code-runner
